<!DOCTYPE html>
<html lang="fr" data-lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Témoins de Jéhovah : proclamateurs, baptêmes et flux, 1914-2050</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<main>
<div class="top">
<h1 data-t="title">Témoins de Jéhovah : proclamateurs, baptêmes et flux, 1914-2050</h1>
<div class="lang" role="group" aria-label="Langue / Language / Idioma">
<button data-flag="fr" title="Français" aria-label="Français"><svg viewBox="0 0 3 2" aria-hidden="true"><rect width="1" height="2" fill="#0055A4"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#EF4135"/></svg></button>
<button data-flag="en" title="English" aria-label="English"><svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="uks"><path d="M0,0 v30 h60 v-30 z"/></clipPath><clipPath id="ukt"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><g clip-path="url(#uks)"><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukt)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></g></svg></button>
<button data-flag="es" title="Español" aria-label="Español"><svg viewBox="0 0 3 2" aria-hidden="true"><rect width="3" height="2" fill="#AA151B"/><rect y=".5" width="3" height="1" fill="#F1BF00"/></svg></button>
</div>
</div>
<p class="intro" data-t="intro"></p>

<nav class="tabs" id="tabs" role="tablist"></nav>
<div class="toolbar">
<button id="shareBtn" data-t="shareBtn"></button>
<details class="menu" id="expMenu">
<summary data-t="expMenu"></summary>
<div class="menulist">
<button id="expPng" data-view data-t="expPng"></button>
<button id="expCsvView" data-view data-t="expCsvView"></button>
<button id="expJsonView" data-view data-t="expJsonView"></button>
<button id="expCsvAll" data-t="expCsvAll"></button>
<button id="expJsonAll" data-t="expJsonAll"></button>
</div>
</details>
</div>

<!-- Onglet : évolution (graphique principal) -->
<div class="tabpanel" id="tab-evolution" data-tab="evolution" role="tabpanel">
<div class="kpis" id="kpis"></div>

<div class="cap" data-t="capPresets"></div>
<div class="bt" id="pv"></div>
<div class="projbar"><span data-t="projLabel"></span><div class="bt" id="pi"></div></div>

<div class="chartbox"><canvas id="c" role="img" aria-label="Chart / Graphique">Chart.</canvas></div>
<div class="legend" id="leg"></div>
<div class="notice" id="unitnote" hidden></div>

<div class="cap" data-t="capSum"></div>
<div id="sum"></div>

<div class="cap" data-t="evKey"></div>
<div id="evl"></div>
<details class="fold"><summary id="evmoreS"></summary><div id="evmore"></div></details>

<details class="fold">
<summary data-t="custTitle"></summary>
<div class="foldbody">
<div class="cap" data-t="cap1"></div>
<div id="gr"></div>
<div class="cap" data-t="cap2"></div>
<div id="gm"></div>
<div class="cap" data-t="capScale"></div>
<div class="bt" id="md"></div>
<div class="bt options">
<label><input type="checkbox" id="bd"><span data-t="band"></span></label>
<label><input type="checkbox" id="sm" checked><span data-t="smooth"></span></label>
<button id="clr" data-t="clr"></button>
</div>
</div>
</details>

<details class="fold">
<summary data-t="modelTitle"></summary>
<div class="foldbody">
<div class="ph"><b data-t="pTitle"></b><span id="plab"></span></div>
<input type="range" id="pr" min="0" max="2" step="0.1" value="1" aria-label="Intensité / Intensity / Intensidad">
<div class="ticks"><span data-t="t0"></span><span data-t="t1"></span><span data-t="t2"></span></div>
<p class="hint" data-t="hint"></p>
<div id="ro"></div>
</div>
</details>

<p class="note" data-t="note"></p>
</div>

<!-- Onglet : congrégations -->
<div class="tabpanel" id="tab-congregations" data-tab="congregations" role="tabpanel" hidden>
<h2 data-t="hCg"></h2>
<p class="intro" data-t="cgIntro"></p>
<div class="chartbox"><canvas id="cgc" role="img" aria-label="Congrégations / Congregations / Congregaciones">Chart.</canvas></div>
<div id="cgsum" style="margin-top:12px"></div>
<details class="doc" style="margin-top:10px"><summary data-t="cgAll" style="cursor:pointer;font-size:14px"></summary><div id="cgtab"></div></details>
</div>

<!-- Onglet : r/exjw -->
<div class="tabpanel" id="tab-reddit" data-tab="reddit" role="tabpanel" hidden>
<h2 data-t="hRx"></h2>
<p class="intro" data-t="rxIntro"></p>
<div class="bt" id="rxmd"></div>
<div class="chartbox" style="height:400px"><canvas id="rxc" role="img" aria-label="r/exjw">Chart.</canvas></div>
<div id="rxsum" style="margin-top:12px"></div>
<div class="doc" id="rxtab"></div>
</div>

<!-- Onglet : dons -->
<div class="tabpanel" id="tab-dons" data-tab="dons" role="tabpanel" hidden>
<h2 data-t="hDn"></h2>
<p class="intro" data-t="dnIntro"></p>
<div class="cap" data-t="dnYear"></div>
<div class="bt" id="dny"></div>
<div class="chartbox" style="height:440px"><canvas id="dnc" role="img" aria-label="Dons par région / Donations by region / Donativos por región">Chart.</canvas></div>
<div id="dnsum" style="margin-top:12px"></div>
<div class="panel"><div class="ph"><b data-t="dnChk"></b></div><div id="dnck" style="margin-top:8px"></div><p class="hint" data-t="dnWarn"></p></div>
</div>

<!-- Onglet : sources et méthodologie (contenu injecté par app.js) -->
<div class="tabpanel" id="tab-sources" data-tab="sources" role="tabpanel" hidden>
<section id="methode" class="doc"></section>
</div>

<!-- Onglet : export de la totalité des données -->
<div class="tabpanel" id="tab-export" data-tab="export" role="tabpanel" hidden>
<h2 data-t="hExp"></h2>
<p class="intro" id="expIntro"></p>
<div class="bt"><button id="expBtnCsv" data-t="expBtnCsv"></button><button id="expBtnJson" data-t="expBtnJson"></button></div>
<div class="cap" data-t="expContents"></div>
<div id="expInfo"></div>
<h3 data-t="expFormat"></h3>
<p class="hint" data-t="expCols"></p>
<p class="hint" data-t="expStatus"></p>
<p class="hint" data-t="expSrc"></p>
</div>
</main>

<script src="js/vendor/chart.umd.js"></script>
<script src="js/lib/utils.js"></script>
<script src="js/data/series.js"></script>
<script src="js/data/regions.js"></script>
<script src="js/data/events.js"></script>
<script src="js/data/reddit.js"></script>
<script src="js/model/params.js"></script>
<script src="js/model/hours.js"></script>
<script src="js/model/history.js"></script>
<script src="js/model/simulation.js"></script>
<script src="js/model/donations.js"></script>
<script src="js/i18n/core.js"></script>
<script src="js/i18n/fr.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/es.js"></script>
<script src="js/i18n/docs.fr.js"></script>
<script src="js/i18n/docs.en.js"></script>
<script src="js/i18n/docs.es.js"></script>
<script src="js/ui/theme.js"></script>
<script src="js/ui/format.js"></script>
<script src="js/ui/widgets.js"></script>
<script src="js/data/catalog.js"></script>
<script src="js/ui/main-chart.js"></script>
<script src="js/ui/section-congregations.js"></script>
<script src="js/ui/section-reddit.js"></script>
<script src="js/ui/section-donations.js"></script>
<script src="js/ui/export.js"></script>
<script src="js/ui/tabs.js"></script>
<script src="js/app.js"></script>
</body>
</html>
